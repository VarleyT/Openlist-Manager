name: Release

# 推送 v* 标签（如 v1.0.0、v1.1.0-beta.1）时自动构建签名 APK 并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          mkdir -p keystore
          # 网页粘贴的 Secret 可能夹带换行/空格/CR，先去除空白再解码
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > keystore/release.jks; then
            echo "::error::KEYSTORE_BASE64 is not valid Base64. Regenerate it with: base64 -w0 release.jks"
            exit 1
          fi
          echo "Decoded keystore: $(stat -c %s keystore/release.jks) bytes"
          if ! keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore check failed: wrong KEYSTORE_PASSWORD, wrong KEY_ALIAS, or corrupted KEYSTORE_BASE64"
            exit 1
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: >
          ./gradlew assembleRelease --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APK
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          DEST="OpenList-Manager-${{ github.ref_name }}.apk"
          mv "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$NOTES" ]]; then
            echo "::error::缺少更新日志 $NOTES，请先提交后再打标签"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenList Manager ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Clean up keystore
        if: always()
        run: rm -rf keystore
